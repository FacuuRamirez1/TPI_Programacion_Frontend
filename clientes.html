<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Librería TU-CO</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a href="#contenido" class="salto-contenido visualmente-oculto">Saltar al contenido</a>

  <header>
    <p class="marca">Librería TU-CO</p>

    <nav class="navegacion" aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Catálogo</a></li>
        <li><a href="libros.html">Libros</a></li>
        <li><a href="clientes.html" aria-current="page">Clientes</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="historial.html">Historial</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido" tabindex="-1">
    <h1>Clientes</h1>

    <section aria-labelledby="titulo-alta-cliente">
      <h2 id="titulo-alta-cliente">Registrar cliente</h2>

      <form id="form-cliente" method="get" novalidate class="formulario">
        <p id="resumen-errores-cliente" class="mensaje mensaje--error" role="alert" hidden></p>

        <p class="campo">
          <label for="nombreCompleto">Nombre completo</label>
          <input type="text" id="nombreCompleto" name="nombreCompleto" aria-describedby="error-nombreCompleto">
        </p>
        <div id="error-nombreCompleto" class="mensaje mensaje--error" hidden></div>

        <p class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" aria-describedby="error-email">
        </p>
        <div id="error-email" class="mensaje mensaje--error" hidden></div>

        <button type="submit" class="boton boton--primario">Registrar cliente</button>
      </form>

      <p id="mensaje-cliente" role="status" hidden class="mensaje"></p>
    </section>

    <section aria-labelledby="titulo-listado-clientes">
      <h2 id="titulo-listado-clientes">Clientes registrados</h2>

      <p id="mensaje-clientes-vacio" role="status" class="mensaje mensaje--vacio">Todavía no hay clientes registrados.</p>

      <div class="tabla-contenedor" role="region" tabindex="0" aria-label="Clientes registrados, tabla desplazable">
        <table id="tabla-clientes" class="tabla">
          <caption>Clientes registrados</caption>
          <thead>
            <tr>
              <th scope="col">Nombre completo</th>
              <th scope="col">Email</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <template id="plantilla-fila-cliente">
      <tr>
        <td></td>
        <td></td>
      </tr>
    </template>
  </main>

  <footer>
    <p>Librería TU-CO — Trabajo Práctico Integrador</p>
  </footer>

  <script src="js/datos-iniciales.js" defer></script>
  <script src="js/almacenamiento.js" defer></script>
  <script src="js/validaciones.js" defer></script>
  <script src="js/clientes.js" defer></script>
</body>
</html>
