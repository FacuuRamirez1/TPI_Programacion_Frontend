<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas — Librería TU-CO</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a href="#contenido" class="salto-contenido visualmente-oculto">Saltar al contenido</a>

  <header>
    <p class="marca">Librería TU-CO</p>

    <nav class="navegacion" aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Catálogo</a></li>
        <li><a href="libros.html">Libros</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="ventas.html" aria-current="page">Ventas</a></li>
        <li><a href="historial.html">Historial</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido" tabindex="-1">
    <h1>Ventas</h1>

    <section aria-labelledby="titulo-composicion">
      <h2 id="titulo-composicion">Composición de la venta</h2>

      <form id="form-venta" method="get" novalidate class="formulario">
        <p id="resumen-errores-venta" class="mensaje mensaje--error" role="alert" hidden></p>

        <p class="campo">
          <label for="clienteId">Cliente</label>
          <select id="clienteId" name="clienteId" aria-describedby="error-clienteId">
            <option value="" disabled selected>Seleccioná un cliente</option>
          </select>
        </p>
        <div id="error-clienteId" class="mensaje mensaje--error" hidden></div>

        <p class="campo">
          <label for="libroId">Libro</label>
          <select id="libroId" name="libroId" aria-describedby="error-libroId">
            <option value="" disabled selected>Seleccioná un libro</option>
          </select>
        </p>
        <div id="error-libroId" class="mensaje mensaje--error" hidden></div>

        <p class="campo">
          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" name="cantidad" aria-describedby="error-cantidad">
        </p>
        <div id="error-cantidad" class="mensaje mensaje--error" hidden></div>

        <button type="submit" class="boton boton--secundario">Agregar renglón</button>

        <div class="tabla-contenedor" role="region" tabindex="0" aria-label="Renglones de la venta, tabla desplazable">
          <table id="tabla-renglones" class="tabla tabla--ancha">
            <caption>Renglones de la venta</caption>
            <thead>
              <tr>
                <th scope="col">Libro</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Precio unitario</th>
                <th scope="col">Subtotal</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <p class="campo">
          <label for="total-venta">Total</label>
          <output id="total-venta" class="badge badge--total">0</output>
        </p>

        <button type="button" id="boton-confirmar" class="boton boton--primario">Confirmar venta</button>

        <p id="mensaje-venta" role="status" class="mensaje mensaje--info" hidden>Todavía no se agregaron renglones a la venta.</p>
      </form>
    </section>

    <template id="plantilla-fila-renglon">
      <tr>
        <td></td>
        <td><input type="number" class="cantidad-renglon" min="1" step="1" inputmode="numeric"></td>
        <td></td>
        <td></td>
        <td><button type="button" class="boton boton--peligro boton--pequeno" data-accion="quitar">Quitar renglón</button></td>
      </tr>
    </template>
  </main>

  <footer>
    <p>Librería TU-CO — Trabajo Práctico Integrador</p>
  </footer>

  <script src="js/datos-iniciales.js" defer></script>
  <script src="js/almacenamiento.js" defer></script>
  <script src="js/validaciones.js" defer></script>
  <script src="js/formato.js" defer></script>
  <script src="js/ventas.js" defer></script>
</body>
</html>
